name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: for f in js/*.js sw.js standard/*.mjs; do node --check "$f"; done
        shell: bash
      - name: App tests
        run: node test/node_smoke.mjs
      - name: Validate ODTS templates
        run: node standard/validate.mjs
